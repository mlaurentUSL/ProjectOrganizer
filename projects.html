<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Projects and Task Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Project Organizer</h1>
    <div id="auth-area">
      <span id="user-status">Not signed in</span>
      <button id="sign-in-btn">Sign In</button>
      <button id="sign-out-btn" style="display:none">Sign Out</button>
    </div>
  </header>

  <main class="container">
    <section class="projects-section">
      <h2>Projects</h2>
      <ul id="project-list">
        <!-- filled by projects.js -->
      </ul>
    </section>

    <aside class="add-section">
      <h2>Add New Project</h2>
      <form id="add-project-form">
        <label for="project-name">Project Name</label>
        <input type="text" id="project-name" name="project-name" required>
        <input type="submit" value="Add Project">
      </form>
    </aside>

    <!-- Activity Panel (shown when a project is selected) -->
    <section id="activity-panel" class="activity-panel" style="display:none;">
      <h2>Activity: <span id="activity-project-name"></span></h2>
      <button id="close-activity-panel" class="btn small">Close</button>
      
      <div class="activity-tabs">
        <button class="activity-tab active" data-tab="time">Time Entries</button>
        <button class="activity-tab" data-tab="meetings">Meeting Notes</button>
        <button class="activity-tab" data-tab="notes">Project Notes</button>
      </div>

      <!-- Time Entries Tab -->
      <div class="activity-content" id="time-tab-content">
        <form id="add-time-entry-form" class="activity-form">
          <label for="time-hours">Hours</label>
          <input type="number" id="time-hours" step="0.5" min="0" required>
          <label for="time-description">Description</label>
          <input type="text" id="time-description" required>
          <button type="submit" class="btn small">Add Time Entry</button>
        </form>
        <ul id="time-entries-list" class="activity-list">
          <!-- Filled by JS -->
        </ul>
      </div>

      <!-- Meeting Notes Tab -->
      <div class="activity-content" id="meetings-tab-content" style="display:none;">
        <form id="add-meeting-note-form" class="activity-form">
          <label for="meeting-title">Meeting Title</label>
          <input type="text" id="meeting-title" required>
          <label for="meeting-notes">Notes</label>
          <textarea id="meeting-notes" rows="4" required></textarea>
          <button type="submit" class="btn small">Add Meeting Note</button>
        </form>
        <ul id="meeting-notes-list" class="activity-list">
          <!-- Filled by JS -->
        </ul>
      </div>

      <!-- Project Notes Tab -->
      <div class="activity-content" id="notes-tab-content" style="display:none;">
        <form id="add-project-note-form" class="activity-form">
          <label for="note-title">Note Title</label>
          <input type="text" id="note-title" required>
          <label for="note-content">Content</label>
          <textarea id="note-content" rows="4" required></textarea>
          <button type="submit" class="btn small">Add Project Note</button>
        </form>
        <ul id="project-notes-list" class="activity-list">
          <!-- Filled by JS -->
        </ul>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Project Organizer</p>
  </footer>

  <!-- firebase-sync is an ES module (optional). Load it first so it can expose window.firebaseSync. -->
  <script type="module" src="firebase-sync.js"></script>
  <!-- main UI script -->
  <script src="projects.js"></script>
</body>
</html>
