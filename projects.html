<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects and Task Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Project and Task Management</h1>
        <div id="sign-in-area">
            <span id="user-info">Not signed in</span>
            <button id="sign-in-btn" class="button">Sign In</button>
            <button id="sign-out-btn" class="button" style="display: none;">Sign Out</button>
        </div>
    </header>
    <main>
        <section>
            <h2>Projects</h2>
            <ul id="project-list"></ul>
        </section>
        <section>
            <h2>Add New Project</h2>
            <form id="add-project-form">
                <label for="project-name">Project Name:</label>
                <input type="text" id="project-name" name="project-name" required>
                <input type="submit" value="Add Project">
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Project Organizer</p>
    </footer>
    <script type="module" src="firebase-sync.js"></script>
    <script src="projects.js"></script>
</body>
</html>
