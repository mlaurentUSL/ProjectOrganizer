<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects and Task Management</title>
</head>
<body>
  <header>
    <h1>Project and Task Management</h1>
  </header>
  <main>
    <section>
      <h2>Projects</h2>
      <!-- THIS id must exist for the script to render the list -->
      <ul id="project-list">
        <!-- project items will be rendered here by projects.js -->
      </ul>
    </section>

    <section>
      <h2>Add New Project</h2>
      <!-- THIS id must exist for the script to handle the form -->
      <form id="add-project-form">
        <label for="project-name">Project Name:</label>
        <input type="text" id="project-name" name="project-name" required />
        <input type="submit" value="Add Project" />
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Project Organizer</p>
  </footer>

  <!-- This must load projects.js. Make sure projects.js is in the same folder. -->
  <script src="projects.js"></script>
</body>
</html>
